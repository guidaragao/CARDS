<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoes PCM P2 - Metodo Sentinela</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:#0e141a;color:#e8edf2}
.tabbar{position:sticky;top:0;z-index:100;display:flex;gap:10px;padding:14px 18px;background:#0e141a;border-bottom:1px solid rgba(255,255,255,.08)}
.tabbar button{font-family:inherit;font-weight:700;font-size:14px;padding:10px 22px;border:none;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.08);color:#cfe;transition:.15s}
.tabbar button.active{background:#CBD12E;color:#002B5C}
.tabbar h1{font-size:14px;font-weight:600;color:#8fb0d6;margin-left:auto;align-self:center;letter-spacing:.04em}
#host{width:100%;height:calc(100vh - 60px)}
#host iframe{width:100%;height:100%;border:none}
</style></head><body>
<div class="tabbar">
  <button id="bt-normal" class="active" onclick="show('normal')">Cards (Modelo)</button>
  <button id="bt-luiz" onclick="show('luiz')">Cards (Luiz)</button>
  <h1>PCM P2 - Turma Salvador</h1>
</div>
<div id="host"><iframe id="frame" src="normal.html"></iframe></div>
<script>
function show(k){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('bt-'+k).classList.add('active');
  document.getElementById('frame').src = k+'.html';
}
</script></body></html>
